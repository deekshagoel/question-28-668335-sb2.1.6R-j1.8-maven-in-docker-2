server.port=8081
# Local development: start databases with bash database-setup-debian.sh
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/db
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app_dev}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDB103Dialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyHbmImpl
spring.jpa.hibernate.naming.physical-strategy=org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
spring.data.mongodb.uri=${MONGODB_URI:mongodb://app:app_dev@127.0.0.1:27017/db?authSource=db}
